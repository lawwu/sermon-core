[project]
name = "sermon-core"
version = "0.2.2"
description = "Ingest, transcribe, and load church sermon recordings: paragraphs, scripture references, series"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sermon-record = "sermon_core.record:main"

[project.optional-dependencies]
# Transcription runs on Apple silicon (Parakeet on MLX); loading and parsing need neither.
ingest = ["yt-dlp>=2025.1.1", "parakeet-mlx>=0.3"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sermon_core"]

# The JSON Schema lives at the repo root for non-Python readers; ship it inside the package too.
[tool.hatch.build.targets.wheel.force-include]
"schema" = "sermon_core/schema"

[tool.pytest.ini_options]
testpaths = ["tests"]
