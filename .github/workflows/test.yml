name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync
      - run: uv run pytest -q
